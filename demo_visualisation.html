<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>ERO1 — Démo parcours de déneigement</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --bg: #111;
    --panel: #1c1c1c;
    --panel-border: #3a3a3a;
    --ink: #eee;
    --muted: #999;
    --snow: #555;
    --cleared: #5bb8e8;
    --amber: #e08a3c;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Arial, Helvetica, sans-serif;overflow:hidden;}
  #map{position:absolute;inset:0;background:#000;}

  .leaflet-tile-pane{filter:brightness(0.85);}
  .leaflet-control-attribution{background:rgba(0,0,0,0.6)!important;color:var(--muted)!important;font-size:9px!important;}
  .leaflet-control-attribution a{color:var(--muted)!important;}

  .hud{
    position:absolute; top:12px; left:12px; z-index:500;
    background:var(--panel); border:1px solid var(--panel-border);
    padding:10px 14px; min-width:220px;
  }
  .hud h1{
    font-size:16px; font-weight:bold; margin:0 0 6px; color:var(--ink);
  }
  .hud .meta{font-size:12px; color:var(--muted); margin-bottom:8px;}
  .stat-row{display:flex; justify-content:space-between; font-size:12px; padding:3px 0; border-top:1px solid var(--panel-border);}
  .stat-row .k{color:var(--muted);}
  .stat-row .v{color:var(--ink); font-weight:bold;}
  .legend{margin-top:8px; padding-top:8px; border-top:1px solid var(--panel-border); display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--muted);}
  .legend .sw{display:inline-block; width:14px; height:3px; margin-right:6px; vertical-align:middle;}
  .legend .sw-net{background:#555;}
  .legend .sw-plan{background:#e08a3c;}
  .legend .sw-clear{background:#5bb8e8;}

  .controls{
    position:absolute; bottom:12px; left:12px; right:12px; z-index:500;
    background:var(--panel); border:1px solid var(--panel-border);
    padding:10px 14px;
    display:flex; align-items:center; gap:12px;
  }
  button.iconbtn{
    background:var(--ink); border:1px solid var(--panel-border); color:#111; width:32px; height:32px;
    font-size:13px; cursor:pointer; flex:0 0 auto;
  }
  button.ghost{
    background:var(--panel); border:1px solid var(--panel-border); color:var(--ink);
    padding:7px 10px; font-family:inherit; font-size:12px; cursor:pointer;
  }
  button.ghost:hover, button.iconbtn:hover{opacity:0.85;}

  .progress-wrap{flex:1; display:flex; flex-direction:column; gap:5px;}
  .progress-track{
    position:relative; height:6px; background:var(--snow); cursor:pointer; overflow:hidden;
  }
  .progress-fill{
    position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--cleared);
  }
  .progress-labels{display:flex; justify-content:space-between; font-size:10px; color:var(--muted);}

  .speed-wrap{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); flex:0 0 auto;}
  input[type=range].speedslider{width:80px;}

  #fileInput, #netInput{display:none;}

  .plow-marker{width:14px; height:14px; position:relative;}
  .plow-marker .dot{
    width:14px; height:14px;
    background:var(--amber); border-radius:50%; border:2px solid #111;
  }
</style>
</head>
<body>

<div id="map"></div>

<div class="hud">
  <h1 id="hudTitle">Parcours déneigement</h1>
  <div class="meta" id="hudMeta">Anjou — Sécurité &amp; Social</div>
  <div class="stat-row"><span class="k">Distance dégagée</span><span class="v" id="statDist">0.0 / 0.0 km</span></div>
  <div class="stat-row"><span class="k">Progression</span><span class="v" id="statPct">0 %</span></div>
  <div class="stat-row"><span class="k">Temps simulé (10 km/h)</span><span class="v" id="statTime">0 h 00</span></div>
  <div class="legend">
    <span><i class="sw sw-net"></i>Réseau du quartier</span>
    <span><i class="sw sw-plan"></i>Trajet prévu</span>
    <span><i class="sw sw-clear"></i>Zone déneigée</span>
  </div>
</div>

<div class="controls">
  <button class="iconbtn" id="playBtn" title="Lecture / Pause">▶</button>
  <button class="ghost" id="resetBtn" title="Recommencer">⟲ Reset</button>
  <div class="progress-wrap">
    <div class="progress-track" id="progressTrack">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-labels"><span id="lblStart">Dépôt</span><span id="lblEnd">Dépôt</span></div>
  </div>
  <div class="speed-wrap">
    Vitesse démo
    <input type="range" class="speedslider" id="speedSlider" min="1" max="10" step="1" value="4" />
    <span id="speedVal">x4</span>
  </div>
  <button class="ghost" id="loadNetBtn">🗺 Charger un quartier</button>
  <input type="file" id="netInput" accept="application/json" />
  <button class="ghost" id="loadBtn">⤴ Charger un itinéraire</button>
  <input type="file" id="fileInput" accept="application/json" />
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  let progressKm = 0;     // distance parcourue actuelle (km)
  let lastTs = null;
  const V_DEMO_BASE = 6;  // km/h "virtuel" de base, multiplié par le slider

  // ---- Carte ----
  const map = L.map('map', { zoomControl: true, attributionControl: true });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    subdomains: 'abcd', maxZoom: 19
  }).addTo(map);

  const networkLayer  = L.polyline([], { color: '#3a4a5c', weight: 1.5, opacity: 0.65 }).addTo(map);
  const fullPathLayer = L.polyline([], { color: '#ffd28a', weight: 3, opacity: 0.85, dashArray: '1,6' }).addTo(map);
  const clearedLayer  = L.polyline([], { color: '#4fc3ff', weight: 4, opacity: 0.9 }).addTo(map);

  const plowIcon = L.divIcon({
    className: '', html: '<div class="plow-marker"><div class="dot"></div></div>',
    iconSize: [14,14], iconAnchor: [7,7]
  });
  const plowMarker = L.marker([0,0], { icon: plowIcon }).addTo(map);

  function haversine(a, b){
    const R = 6371;
    const dLat = (b.lat-a.lat) * Math.PI/180;
    const dLon = (b.lon-a.lon) * Math.PI/180;
    const lat1 = a.lat * Math.PI/180, lat2 = b.lat * Math.PI/180;
    const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  function loadNetwork(graphData){
    const nodes = graphData.nodes;
    const segs = graphData.edges
      .filter(e => nodes[e.source] && nodes[e.target])
      .map(e => [
        [nodes[e.source].lat, nodes[e.source].lon],
        [nodes[e.target].lat, nodes[e.target].lon]
      ]);
    networkLayer.setLatLngs(segs);
    if(segs.length){
      map.fitBounds(networkLayer.getBounds(), { padding: [30,30] });
    }
    document.getElementById('hudTitle').textContent =
      `Parcours déneigement — ${graphData.quartier || '?'}`;
  }

  function loadRoute(points, metaInfo){
    route = points;
    meta = metaInfo || { quartier: '—', scenario: '—', zone: '?' };
    cumDist = [0];
    for(let i=1;i<route.length;i++){
      cumDist.push(cumDist[i-1] + haversine(route[i-1], route[i]));
    }
    totalDist = cumDist[cumDist.length-1];
    progressKm = 0; playing = false; lastTs = null;
    document.getElementById('playBtn').textContent = '▶';

    const latlngs = route.map(p => [p.lat, p.lon]);
    fullPathLayer.setLatLngs(latlngs);
    clearedLayer.setLatLngs([]);
    if(networkLayer.getLatLngs().length === 0){
      // pas de réseau chargé : on recadre au moins sur le trajet
      map.fitBounds(fullPathLayer.getBounds(), { padding: [40,40] });
    }

    document.getElementById('hudMeta').textContent = `${meta.quartier} — ${meta.scenario} (zone ${meta.zone})`;
    render();
  }

  function positionAt(km){
    if(km <= 0) return route[0];
    if(km >= totalDist) return route[route.length-1];
    // recherche du segment
    let lo = 0, hi = cumDist.length-1;
    while(lo < hi){
      const mid = (lo+hi)>>1;
      if(cumDist[mid] < km) lo = mid+1; else hi = mid;
    }
    const i = Math.max(1, lo);
    const segStart = cumDist[i-1], segEnd = cumDist[i];
    const t = segEnd > segStart ? (km - segStart) / (segEnd - segStart) : 0;
    const a = route[i-1], b = route[i];
    return { lat: a.lat + (b.lat-a.lat)*t, lon: a.lon + (b.lon-a.lon)*t, idx: i, t };
  }

  function clearedPolylineUpTo(km){
    const out = [];
    for(let i=0;i<route.length;i++){
      if(cumDist[i] <= km){ out.push([route[i].lat, route[i].lon]); }
      else break;
    }
    const pos = positionAt(km);
    out.push([pos.lat, pos.lon]);
    return out;
  }

  function fmtTime(h){
    const hh = Math.floor(h);
    const mm = Math.round((h - hh) * 60);
    return `${hh} h ${String(mm).padStart(2,'0')}`;
  }

  function render(){
    const pos = positionAt(progressKm);
    plowMarker.setLatLng([pos.lat, pos.lon]);
    clearedLayer.setLatLngs(clearedPolylineUpTo(progressKm));

    const pct = totalDist > 0 ? (progressKm/totalDist*100) : 0;
    document.getElementById('statDist').textContent = `${progressKm.toFixed(1)} / ${totalDist.toFixed(1)} km`;
    document.getElementById('statPct').textContent = `${pct.toFixed(0)} %`;
    document.getElementById('statTime').textContent = fmtTime(progressKm / 10); // V_MOY = 10km/h du modèle
    document.getElementById('progressFill').style.width = pct + '%';
  }

  function tick(ts){
    if(!playing) return;
    if(lastTs === null) lastTs = ts;
    const dtSec = (ts - lastTs) / 1000;
    lastTs = ts;
    const speedMult = parseFloat(document.getElementById('speedSlider').value);
    const kmPerSec = (V_DEMO_BASE * speedMult) / 3600;
    progressKm = Math.min(totalDist, progressKm + kmPerSec * dtSec * 200); // facteur d'accélération démo
    render();
    if(progressKm < totalDist){
      requestAnimationFrame(tick);
    } else {
      playing = false;
      document.getElementById('playBtn').textContent = '▶';
    }
  }

  document.getElementById('playBtn').addEventListener('click', () => {
    playing = !playing;
    document.getElementById('playBtn').textContent = playing ? '❙❙' : '▶';
    if(playing){ lastTs = null; requestAnimationFrame(tick); }
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    progressKm = 0; playing = false; lastTs = null;
    document.getElementById('playBtn').textContent = '▶';
    render();
  });

  document.getElementById('speedSlider').addEventListener('input', (e) => {
    document.getElementById('speedVal').textContent = 'x' + e.target.value;
  });

  document.getElementById('progressTrack').addEventListener('click', (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    progressKm = ratio * totalDist;
    render();
  });

  document.getElementById('loadBtn').addEventListener('click', () => {
    document.getElementById('fileInput').click();
  });

  document.getElementById('fileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try{
        const data = JSON.parse(evt.target.result);
        const name = file.name.replace('.json','');
        loadRoute(data, { quartier: name, scenario: '', zone: '' });
      } catch(err){
        alert('Fichier JSON invalide : ' + err.message);
      }
    };
    reader.readAsText(file);
  });

  document.getElementById('loadNetBtn').addEventListener('click', () => {
    document.getElementById('netInput').click();
  });

  document.getElementById('netInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try{
        const data = JSON.parse(evt.target.result);
        loadNetwork(data);
      } catch(err){
        alert('Fichier réseau invalide : ' + err.message);
      }
    };
    reader.readAsText(file);
  });

  //init
  loadNetwork(DEFAULT_NETWORK);
  loadRoute(DEFAULT_ROUTE, DEFAULT_META);
</script>
</body>
</html>
